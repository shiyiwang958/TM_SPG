#-----------------Tilt Matching Training Config-----------------
tm:
  a_end: 100.0
  buffer_chunk_size: 40
  buffer_refresh_steps: 50
  control_variate: 1.24
  control_variate_ema: 0.04
  grad_accum_steps: 6
  h: 1
  learned_cv: false
  loss_type: itm
  num_batch_prompts: 2
  num_batch_states: 512
  num_rebuilds_per_h: 25
  num_buffer_prompts: 80
  num_buffer_refresh: 20
  num_completions_per_prompt: 6
  ce_topk: 64
  rescale_logits: false
  rwd_shift: -2.0
  rwd_shift_auto: true
  steps_per_h: 500 # this is the number of optimizer steps per h
  log_student: true
  log_temperature: 0.0
  student_log_steps: 100
  student_logs_per_prompt: 1
  student_copy_over: false
  reset_global_step: false
  use_ema: true
  ema_decay: 0.95
  mix_batches: true

#-----------------Optimizer Config-----------------
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1e-8
weight_decay: 0.1

max_grad_norm: 1.0
learning_rate: 6e-6
lr_decay_ratio: 0.15
lr_min: 3e-6
lr_scheduler_type: linear
lr_warmup_ratio: 0.05

#-----------------Diffusion Generation Config-----------------
block_length: 32
cfg_scale: 0.0
diffusion_steps: 128
max_completion_length: 256
max_prompt_length: 240
remasking_strategy: low_confidence
sampling_temperature: 1.0

#-----------------Model Config-----------------
use_peft: true
torch_dtype: bfloat16
load_in_4bit: true
base_model_path: /n/netscratch/albergo_lab/Everyone/frank/hf_models/LLaDA-8B-Instruct

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

#-----------------Logging and Checkpointing Config-----------------
eval: true
checkpoint_dir: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/gsm_smallLR_mix_final_isefjoiwfjiejfige
metrics_log_every: 1
resume_path:
# leave empty if not resuming
# wandb:
#   entity: "yuyuanchen-harvard-university"
#   project: "LLaDA_TM"
#   name: "gsm"

#-----------------Other Training Config-----------------
dataset: "math"
max_rwd: 2.0
math_split_idx: null
few_shot: 0
seed: 42
nodes: 4
devices: 2  # 8? 4?
world_size: 4

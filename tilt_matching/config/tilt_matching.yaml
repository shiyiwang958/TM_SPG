#-----------------Tilt Matching Training Config-----------------
tm:
  a_end: 100.0
  buffer_chunk_size: 64
  buffer_refresh_steps: 8
  buffer_print_samples: 4   # 0 disables printing
  control_variate: 6.0
  control_variate_ema: 0.05
  grad_accum_steps: 4
  h: 3.0
  loss_type: itm
  num_batch_prompts: 4
  num_buffer_prompts: 64
  num_buffer_refresh: 16
  num_completions_per_prompt: 3
  rescale_logits: false
  rwd_shift: -2.0
  steps_per_h: 256 # this is the number of optimizer steps per h

#-----------------Optimizer Config-----------------
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1e-8
weight_decay: 0.1

max_grad_norm: 3.0
learning_rate: 5e-5
lr_decay_ratio: 0.1
lr_min: 3e-5
lr_scheduler_type: linear
lr_warmup_ratio: 0.15

#-----------------Diffusion Generation Config-----------------
block_length: 32
cfg_scale: 0.0 #TODO: check
diffusion_steps: 128
max_completion_length: 256
max_prompt_length: 240
remasking_strategy: low_confidence # or random
sampling_temperature: 0.9

#-----------------Model Config-----------------
use_peft: true
torch_dtype: bfloat16
load_in_4bit: true
base_model_path: /n/netscratch/albergo_lab/Everyone/frank/hf_models/LLaDA-8B-Instruct

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

#-----------------Logging and Checkpointing Config-----------------
checkpoint_dir: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/gsm8k_new
checkpoint_freq: 3.0  # in units of h
metrics_log_every: 2
resume_path: # /n/netscratch/albergo_lab/Everyone/frank/llada_tm/gsm8k/checkpoint-a-4.000.ckpt
# leave empty if not resuming
wandb:
  entity: "yuyuanchen-harvard-university"
  project: "LLaDA_TM"
  name: "gsm_new_phase1"

#-----------------Other Training Config-----------------
dataset: "gsm8k"
few_shot: 0
seed: 42
nodes: 2
devices: 4  # 8? 4?

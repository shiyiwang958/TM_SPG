#-----------------Tilt Matching Training Config-----------------
tm:
  a_end: 100.0
  buffer_chunk_size: 16
  buffer_refresh_steps: 1
  control_variate: 1.0
  grad_accum_steps: 1
  h: 0.10
  loss_type: itm
  method: onpolicy
  num_batch_prompts: 1
  num_buffer_prompts: 2 # grad accum steps can't use more prompts than the buffer has, otherwise indexing error
  num_buffer_refresh: 2
  num_completions_per_prompt: 2
  rescale_logits: false
  rwd_shift: 0.0
  steps_per_h: 150 # this is the number of optimizer steps per h

#-----------------Optimizer Config-----------------
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1e-8
weight_decay: 0.1

max_grad_norm: 2.0
learning_rate: 1e-4
lr_decay_ratio: 0.25
lr_min: 6e-5
lr_scheduler_type: linear
lr_warmup_ratio: 0.0

#-----------------Diffusion Generation Config-----------------
block_length: 32
cfg_scale: 0.0 #TODO: check
diffusion_steps: 128
max_completion_length: 256
max_prompt_length: 172  # short for countdown
remasking_strategy: low_confidence # or random
sampling_temperature: 0.9

#-----------------Model Config-----------------
use_peft: true
torch_dtype: bfloat16
load_in_4bit: true
base_model_path: /n/netscratch/albergo_lab/Everyone/frank/hf_models/LLaDA-8B-Instruct
# don't implement any attention for llada

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

#-----------------Logging and Checkpointing Config-----------------
checkpoint_dir: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/countdown_scratch
checkpoint_freq: 0.10  # in units of h
metrics_log_every: 1
resume_path: 
# leave empty if not resuming
# wandb:
#   entity: "yuyuanchen-harvard-university"
#   project: "LLaDA_TM"
#   name: "test"

#-----------------Other Training Config-----------------
dataset: countdown
max_rwd: 5.0
few_shot: 0
seed: 42
nodes: 1
devices: 1  # 8? 4?
world_size: 8

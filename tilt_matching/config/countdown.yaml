#-----------------Tilt Matching Training Config-----------------
tm:
  a_end: 100.0
  buffer_chunk_size: 60
  buffer_print_samples: 0
  buffer_refresh_steps: 40
  control_variate: 1.0
  control_variate_ema: 0.04
  ema_decay: 0.95
  grad_accum_steps: 8
  h: 3.0
  learned_cv: false
  loss_type: itm
  mix_batches: true
  num_batch_prompts: 2
  num_buffer_prompts: 80  # grad accum steps can't use more prompts than the buffer has, otherwise indexing error
  num_buffer_refresh: 20
  num_completions_per_prompt: 6
  rescale_logits: false
  rwd_shift: 0.0
  rwd_shift_auto: false
  steps_per_h: 800 # this is the number of optimizer steps per h
  log_student: true
  log_temperature: 0.0
  student_log_steps: 400
  student_logs_per_prompt: 1
  use_ema: true

#-----------------Optimizer Config-----------------
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1e-8
weight_decay: 0.1

max_grad_norm: 2.0 # to be decreased
learning_rate: 4e-6
lr_decay_ratio: 0.20
lr_min: 2e-6
lr_scheduler_type: linear
lr_warmup_ratio: 0.0

#-----------------Diffusion Generation Config-----------------
block_length: 32
cfg_scale: 0.0
diffusion_steps: 128
max_completion_length: 256
max_prompt_length: 172
remasking_strategy: random
sampling_temperature: 1.0

#-----------------Model Config-----------------
use_peft: true
torch_dtype: bfloat16
load_in_4bit: true
base_model_path: /n/netscratch/albergo_lab/Everyone/frank/hf_models/LLaDA-8B-Instruct
# don't implement any attention for llada

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

#-----------------Logging and Checkpointing Config-----------------
checkpoint_dir: /n/netscratch/albergo_lab/Everyone/yuyuan0/ctd/cv1
ckpt_freq: 100 # in optimizer steps
metrics_log_every: 1
resume_path: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/countdown_result/checkpoint-log-22.0.ckpt
# leave empty if not resuming
student_copy_over: true

wandb:
  entity: "yuyuanchen-harvard-university"
  project: "LLaDA_TM"
  name: "ctd_cv"

#-----------------Other Training Config-----------------
dataset: countdown
max_rwd: 1.0
few_shot: 0
seed: 42
nodes: 4
devices: 2  # 8? 4?
world_size: 8

#-----------------Tilt Matching Training Config-----------------
tm:
  a_end: 100.0
  buffer_chunk_size: 64
  buffer_refresh_steps: 24
  control_variate: 1.0
  grad_accum_steps: 8 # on-policy learning
  h: 0.1
  loss_type: itm
  method: offpolicy
  num_batch_prompts: 2
  num_buffer_prompts: 32 # grad accum steps can't use more prompts than the buffer has, otherwise indexing error
  num_buffer_refresh: 8
  num_completions_per_prompt: 6
  rescale_logits: false
  rwd_shift: 0.0
  steps_per_h: 120 # this is the number of optimizer steps per h

#-----------------Optimizer Config-----------------
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1e-8
weight_decay: 0.1

max_grad_norm: 2.0
learning_rate: 1e-4
lr_decay_ratio: 0.25
lr_min: 5e-5
lr_scheduler_type: linear
lr_warmup_ratio: 0.0

#-----------------Diffusion Generation Config-----------------
block_length: 32
cfg_scale: 0.0 #TODO: check
diffusion_steps: 128
max_completion_length: 256
max_prompt_length: 172  # short for countdown
remasking_strategy: low_confidence # or random
sampling_temperature: 0.9

#-----------------Model Config-----------------
use_peft: true
torch_dtype: bfloat16
load_in_4bit: true
base_model_path: /n/netscratch/albergo_lab/Everyone/frank/hf_models/LLaDA-8B-Instruct
# don't implement any attention for llada

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

#-----------------Logging and Checkpointing Config-----------------
checkpoint_dir: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/countdown_offpolicy
checkpoint_freq: 0.1
metrics_log_every: 1
resume_path: /n/netscratch/albergo_lab/Everyone/frank/llada_tm/countdown_offpolicy/checkpoint-a-2.100.ckpt
# leave empty if not resuming
wandb:
  entity: "yuyuanchen-harvard-university"
  project: "LLaDA_TM"
  name: "buffer-fullprompt"

#-----------------Other Training Config-----------------
dataset: countdown
max_rwd: 5.0
few_shot: 0
seed: 42
nodes: 4
devices: 2  # 8? 4?
world_size: 8
